<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="960" height="330" fill="#fff" />
<text x="40" y="30" font-size="15" font-weight="700" fill="#111">Accuracy on gold-labelled production questions — against the null arm and the best clone</text>
<text x="40" y="46" font-size="10.5" fill="#666">Same questions, human-reviewed labels (2026-09-20). The null arm — “always answer the majority class” — is the bar a tool must clear to measure anything.</text>
